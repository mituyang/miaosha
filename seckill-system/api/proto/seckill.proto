syntax = "proto3";

package seckill;

option go_package = "./seckill";

// 秒杀服务定义
service SeckillService {
  // 执行秒杀
  rpc DoSeckill(SeckillRequest) returns (SeckillResponse);
  // 查询秒杀结果
  rpc GetSeckillResult(ResultRequest) returns (ResultResponse);
}

// 秒杀请求
message SeckillRequest {
  string user_id = 1;   // 用户名
  int64 goods_id = 2;   // 商品ID
}

// 秒杀响应
message SeckillResponse {
  int32 code = 1;       // 状态码: 0-成功, 1-库存不足, 2-重复秒杀, 3-系统错误
  string message = 2;   // 提示信息
  string order_id = 3;  // 订单ID (成功时返回)
}

// 结果查询请求
message ResultRequest {
  string user_id = 1;  // 用户名
  int64 goods_id = 2;  // 商品ID
}

// 结果查询响应
message ResultResponse {
  int32 status = 1;     // -1: 排队中, 0: 秒杀成功, 1: 秒杀失败
  string order_id = 2;
}
