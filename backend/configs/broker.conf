brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 允许自动创建 topic
autoCreateTopicEnable = true

# Broker IP 配置
brokerIP1 = 172.28.0.11

# 定时消息配置（RocketMQ 5.x）
timerWheelEnable = true

# ========== 性能优化配置 ==========

# 发送消息线程池大小（提升处理能力）
sendMessageThreadPoolNums = 64

# 拉取消息线程池大小
pullMessageThreadPoolNums = 64

# 单个 Broker 上 Topic 队列数量（增加并行度）
defaultTopicQueueNums = 16

# 发送消息快速失败
sendThreadPoolQueueCapacity = 200000

# 等待存储消息超时时间
waitTimeMillsInSendQueue = 5000

# 传输层配置（增大缓冲区）
serverSocketSndBufSize = 262144
serverSocketRcvBufSize = 262144

# 刷盘优化（进一步降低刷盘频率，提升吞吐）
flushCommitLogTimed = true
flushIntervalCommitLog = 2000
flushIntervalConsumeQueue = 2000

# 消息传输优化
transferMsgByHeap = false
useReentrantLockWhenPutMessage = true
