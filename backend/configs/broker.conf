brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 允许自动创建 topic
autoCreateTopicEnable = true

# Broker IP 配置
brokerIP1 = 172.28.0.11

# 定时消息配置（RocketMQ 5.x）
timerWheelEnable = true

# ========== 性能优化配置 ==========

# 发送消息线程池大小（默认1，高并发需要增大）
sendMessageThreadPoolNums = 16

# 拉取消息线程池大小
pullMessageThreadPoolNums = 32

# 处理客户端请求线程池
processReplyMessageThreadPoolNums = 16

# 单个 Broker 上 Topic 队列数量
defaultTopicQueueNums = 8

# 发送消息快速失败（避免队列堆积）
sendThreadPoolQueueCapacity = 100000

# OS PageCache 繁忙时快速失败
osPageCacheBusyTimeOutMills = 5000

# 等待存储消息超时时间
waitTimeMillsInSendQueue = 3000

# 开启 Slave 读权限（主从架构时）
slaveReadEnable = true

# 传输层配置
serverSocketSndBufSize = 131072
serverSocketRcvBufSize = 131072
